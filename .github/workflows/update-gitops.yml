name: Build and Update GitOps Repo

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-app
  HARBOR_REGISTRY: 172.25.87.31:80
  HARBOR_PROJECT: library
  DEPLOY_REPO: XueNHZ/my-k8s-app-deploy

jobs:
  build-and-update:
    runs-on: [self-hosted, linux, x64, harbor]
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=v${{ github.run_number }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
              network=host
              env.http_proxy=http://172.25.80.1:7897
              env.https_proxy=http://172.25.80.1:7897
              env.no_proxy=172.25.87.31
          buildkitd-config-inline: |
            [registry."172.25.87.31:80"]
              http = true
              insecure = true

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: deploy-repo

      - name: Install yq
        run: |
           set -euo pipefail

           YQ_DIR="$RUNNER_TEMP/bin"
           mkdir -p "$YQ_DIR"

           curl --fail --location --show-error --retry 5 \
                -o "$YQ_DIR/yq" \
                https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

           chmod +x "$YQ_DIR/yq"
           echo "$YQ_DIR" >> "$GITHUB_PATH"

           "$YQ_DIR/yq" --version

      - name: Update image tag in values.yaml
        run: |
          cd deploy-repo
          yq -i '.image.tag = strenv(IMAGE_TAG)' charts/my-app/values.yaml
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Commit and push to deploy repo
        run: |
          cd deploy-repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -am "chore: update my-app image tag to $IMAGE_TAG [skip ci]"
          git push origin main
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
